<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>everdays</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    /* Each slot wraps a blur layer + sharp layer and fades as one unit */
    .slot {
      position: absolute;
      inset: 0;
      transition: opacity 0.6s ease;
    }

    #slot-b {
      opacity: 0;
    }

    /* Blurred fill — always cover, scaled up to hide blur-edge artifacts */
    .blur-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transform: scale(1.12);
      filter: blur(40px) brightness(0.45);
    }

    /* Sharp image — background-size set dynamically (cover for landscape, contain for square/portrait) */
    .sharp-layer {
      position: absolute;
      inset: 0;
      background-position: center center;
      background-repeat: no-repeat;
    }

    #vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 90% 90% at 50% 50%,
        rgba(0, 0, 0, 0.1) 0%,
        rgba(0, 0, 0, 0.7) 100%
      );
      pointer-events: none;
    }

    #center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      pointer-events: none;
    }

    #timer {
      color: #fff;
      font-family: 'SF Mono', 'Fira Code', 'Fira Mono', ui-monospace, monospace;
      font-size: clamp(2.5rem, 10vw, 9rem);
      font-weight: 200;
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 80px rgba(0, 0, 0, 0.5);
      line-height: 1;
      user-select: none;
    }

    #day {
      color: rgba(255, 255, 255, 0.3);
      font-family: 'SF Mono', 'Fira Code', 'Fira Mono', ui-monospace, monospace;
      font-size: clamp(0.55rem, 1.4vw, 0.8rem);
      font-weight: 400;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="slot-a" class="slot">
      <div class="blur-layer" id="blur-a"></div>
      <div class="sharp-layer" id="sharp-a"></div>
    </div>
    <div id="slot-b" class="slot">
      <div class="blur-layer" id="blur-b"></div>
      <div class="sharp-layer" id="sharp-b"></div>
    </div>
    <div id="vignette"></div>
    <div id="center">
      <div id="timer">0000</div>
      <div id="day">day —</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
