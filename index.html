<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>everdays</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    /* WebGL canvas renders the image + water ripple simulation */
    #gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      filter: brightness(1.25);
    }

    #vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 90% 90% at 50% 50%,
        rgba(0, 0, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.45) 100%
      );
      pointer-events: none;
    }

    #center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.6rem;
      pointer-events: none;
    }

    #timer {
      color: #fff;
      font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(3rem, 13vw, 11rem);
      font-weight: 300;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 80px rgba(0, 0, 0, 0.5);
      line-height: 1;
      user-select: none;
    }

    #day {
      color: #fff;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(0.8rem, 2vw, 1.1rem);
      font-weight: 600;
      letter-spacing: 0.4em;
      text-indent: 0.4em;
      text-transform: uppercase;
      text-shadow: 0 1px 24px rgba(0, 0, 0, 0.9);
      user-select: none;
      opacity: 1;
      transition: opacity 300ms ease;
    }

    /* Held at 0 (transition off) right before a swap, then released to fade in. */
    #day.swap {
      opacity: 0;
      transition: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="vignette"></div>
    <div id="center">
      <div id="day">day —</div>
      <div id="timer">0000</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
